[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-engine"
version = "0.1.0"
description = "A modular portfolio P&L, volatility, VaR, and Expected Shortfall engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]
